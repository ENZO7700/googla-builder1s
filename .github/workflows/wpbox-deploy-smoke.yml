name: wpBOX Deploy Smoke

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Post-deploy verification: live URL + optional WordPress write test.
# Configure GitHub secrets (same as wpbox-ci integration job).

on:
  # Fires when Vercel GitHub integration reports a successful deploy.
  deployment_status:
  workflow_dispatch:
    inputs:
      prod_url:
        description: Deploy URL to smoke-test
        required: false
        default: https://larsenevans-wpbox.vercel.app
      write_test:
        description: Run draft post create+delete on web24
        type: boolean
        default: true
  schedule:
    # Daily 06:00 UTC — catches env drift / WP API breakage overnight
    - cron: "0 6 * * *"

concurrency:
  group: wpbox-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production smoke
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Resolve deploy URL
        id: url
        run: |
          URL="${DEPLOY_URL}"
          echo "deploy_url=${URL}" >> "$GITHUB_OUTPUT"
          if [[ "$URL" != *"larsenevans-wpbox"* && "$URL" != *"larsenevans.com"* && "$GITHUB_EVENT_NAME" == "deployment_status" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠ Skipping non-wpBOX deploy: ${URL}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.inputs.prod_url || vars.WPBOX_PROD_URL || 'https://larsenevans-wpbox.vercel.app' }}

      - name: Quick smoke (HTTP 200 + timing + brand check)
        if: steps.url.outputs.skip != 'true'
        run: npm run smoke:preview -- "${{ steps.url.outputs.deploy_url }}"

      - name: Full-stack healthcheck (Supabase + WP proxy)
        if: steps.url.outputs.skip != 'true'
        run: |
          if [[ "${{ github.event.inputs.write_test }}" == "false" ]]; then
            npm run healthcheck
          else
            npm run healthcheck:write
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          WPBOX_EMAIL: ${{ secrets.WPBOX_EMAIL }}
          WPBOX_PASSWORD: ${{ secrets.WPBOX_PASSWORD }}
          WPBOX_PROD_URL: ${{ steps.url.outputs.deploy_url }}
          WP_HEALTH_WEB24: ${{ vars.WP_HEALTH_WEB24 || 'https://larsenevans.com/web24' }}
          WP_HEALTH_ROOT: ${{ vars.WP_HEALTH_ROOT || 'https://larsenevans.com' }}

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule' && steps.url.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'wpBOX scheduled smoke test failed';
            try {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
              if (issues.some((i) => i.title === title)) {
                core.info('Open smoke-failure issue already exists');
                return;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'Scheduled deploy smoke (`wpbox-deploy-smoke.yml`) failed.',
                  '',
                  `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'Check Supabase env on Vercel, WordPress web24 REST, and GitHub Actions secrets.',
                ].join('\n'),
              });
            } catch (err) {
              if (err.status === 403) {
                core.warning(
                  'Skipping smoke-failure issue: GITHUB_TOKEN lacks issues:write (403). ' +
                  'Grant issues:write in workflow permissions or repository settings.',
                );
                return;
              }
              throw err;
            }
